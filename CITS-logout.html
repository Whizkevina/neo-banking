<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logged Out</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .logout-container {
      background: white;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .logout-container h2 {
      color: #444;
      margin-bottom: 16px;
    }

    .logout-container p {
      color: #666;
      font-size: 16px;
      margin-bottom: 24px;
    }

    .logout-container a.button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #f97316;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .logout-container a.button:hover {
      background-color: #ea580c;
    }
  </style>
</head>
<body>
  <div class="status-container">
    <h2>You’ve Been Logged Out</h2>
    <p>Thank you for using our internet service.</p>
    <a href="CITS-index-modern.html" class="button">Reconnect</a>
  </div>
</body>
</html>
